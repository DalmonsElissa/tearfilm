[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tearfilm-persistence"
version = "1.0.0"
description = "Two-timescale persistence model for tear-film break-up measurement from robotic anterior-segment streams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "torch>=2.2,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "mypy>=1.10,<2",
    "ruff>=0.6,<1",
    "black>=24.4,<26",
]

[project.scripts]
tearfilm-train = "tearfilm_persistence.cli.train:main"
tearfilm-evaluate = "tearfilm_persistence.cli.evaluate:main"
tearfilm-infer = "tearfilm_persistence.cli.infer:main"
tearfilm-calibrate = "tearfilm_persistence.cli.calibrate:main"
tearfilm-verify = "tearfilm_persistence.cli.verify:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:tearfilm_persistence.*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unreachable = true
pretty = true
files = ["src/tearfilm_persistence"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "yaml.*"]
ignore_missing_imports = true
